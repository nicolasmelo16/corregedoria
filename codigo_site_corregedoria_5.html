<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Corregedoria PMERJ · Prova de Conscritos</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0a1224;--card:#111d38;--line:#25365e;--gold:#d4af37;--tx:#e8ecf5;--mut:#8d9bbd;--ok:#3ecf8e;--bad:#ef5b5b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:2px solid var(--gold);background:#0d1830}
header b{display:block;letter-spacing:2px;color:var(--gold);font-size:15px}header small{color:var(--mut);letter-spacing:1px}
main{max-width:760px;margin:0 auto;padding:22px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px}
h2{margin:0 0 6px;color:var(--gold);letter-spacing:1px}p{color:var(--mut)}
label{display:block;margin:14px 0 4px;font-size:13px;color:var(--mut);letter-spacing:1px;text-transform:uppercase}
input,textarea{width:100%;background:#0a1224;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:11px;font:inherit}
textarea{min-height:140px;resize:vertical}input:focus,textarea:focus{outline:2px solid var(--gold)}
button{background:var(--gold);color:#0a1224;border:0;border-radius:6px;padding:12px 20px;font-weight:700;letter-spacing:1px;cursor:pointer;margin-top:16px}
button:disabled{opacity:.4}.opt{display:block;width:100%;text-align:left;background:#0a1224;color:var(--tx);border:1px solid var(--line);font-weight:500;letter-spacing:0;margin-top:10px}
.opt.sel{border-color:var(--gold);background:#1a2850}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--mut);font-size:14px}
.tm{font:700 22px ui-monospace,monospace;color:var(--gold)}.tm.low{color:var(--bad)}
.bar{height:5px;background:var(--line);border-radius:3px;margin-bottom:18px}.bar i{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width 1s linear}
pre{white-space:pre-wrap;word-break:break-all;background:#0a1224;border:1px solid var(--line);border-radius:6px;padding:12px;max-height:260px;overflow:auto;font-size:12px}
.rep{white-space:pre-wrap;word-break:normal;font-size:14px;max-height:none}a{color:var(--gold)}.err{color:var(--bad)}
.sum{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0;padding:14px;border:1px solid var(--gold);border-radius:8px;background:#0d1830}
.sum div{flex:1 1 130px}.sum small{display:block;color:var(--mut);font-size:11px;letter-spacing:1px}.sum b{font-size:16px}.sum .big{font-size:30px;color:var(--gold)}
.qc{margin-top:14px;padding:14px;border-radius:8px;background:#0d1830;border:1px solid var(--line)}.qc.di{border-left:5px solid var(--gold)}.qc.ob{border-left:5px solid #5b8def}
.qh{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.qh b{color:var(--gold);letter-spacing:1px}
.tg{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--line);color:var(--tx);letter-spacing:1px}.tg.bad{background:var(--bad);color:#fff}
.qq{color:var(--tx);margin:10px 0;font-weight:600}.op{padding:8px 10px;margin-top:6px;border:1px solid var(--line);border-radius:6px;font-size:14px}.op em{font-size:12px;color:var(--mut);font-style:normal}
.op.gab{border-color:var(--ok)}.op.ok{background:rgba(62,207,142,.18)}.op.no{background:rgba(239,91,91,.2);border-color:var(--bad)}
.ans{background:#0a1224;border:1px dashed var(--gold);border-radius:6px;padding:12px;white-space:pre-wrap;color:var(--tx)}.ans.blank{color:var(--bad);border-color:var(--bad)}
.gh{background:transparent;color:var(--gold);border:1px solid var(--gold);margin-top:6px}
.alb{margin-top:14px;padding:12px 14px;border-radius:8px;border:1px solid var(--line);border-left:5px solid var(--mut);background:#0d1830}.alb b{display:block}.alb small{color:var(--mut)}
.a0{border-left-color:var(--ok)}.a1{border-left-color:#e6c84a}.a2{border-left-color:#f39a3d}.a3{border-left-color:var(--bad);background:rgba(239,91,91,.12)}
.al{margin-top:10px;padding:10px;border-radius:6px;background:rgba(239,91,91,.1);border:1px dashed var(--bad);font-size:13px}
</style></head><body>

const E=new TextEncoder(),D=new TextDecoder(),S=crypto.subtle,EC={name:"ECDSA",namedCurve:"P-256"},SG={name:"ECDSA",hash:"SHA-256"};
const b2u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0)),u2b=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
async function unvault(v,pw){const[s,iv,ct]=v.split(".").map(b2u),km=await S.importKey("raw",E.encode(pw),"PBKDF2",false,["deriveKey"]);
const kk=await S.deriveKey({name:"PBKDF2",salt:s,iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);return S.decrypt({name:"AES-GCM",iv},kk,ct)}
async function seal(t){const pk=await S.importKey("spki",b2u(PUB),{name:"RSA-OAEP",hash:"SHA-256"},false,["encrypt"]);
const ak=await S.generateKey({name:"AES-GCM",length:256},true,["encrypt"]),iv=crypto.getRandomValues(new Uint8Array(12));
const c=await S.encrypt({name:"AES-GCM",iv},ak,E.encode(t)),k=await S.encrypt({name:"RSA-OAEP"},pk,await S.exportKey("raw",ak));return["CORREG1",u2b(iv),u2b(k),u2b(c)].join(".")}
async function openReport(code,pw){const sk=await S.importKey("pkcs8",await unvault(VAULT,pw),{name:"RSA-OAEP",hash:"SHA-256"},false,["decrypt"]);
const p=code.trim().split(".");if(p[0]!=="CORREG1"||p.length!==4)throw 0;
const ak=await S.importKey("raw",await S.decrypt({name:"RSA-OAEP"},sk,b2u(p[2])),"AES-GCM",false,["decrypt"]);
return D.decode(await S.decrypt({name:"AES-GCM",iv:b2u(p[1])},ak,b2u(p[3])))}
async function mkCode(pw,id,h){const v=JSON.parse(D.decode(await unvault(VAULT2,pw))),sk=await S.importKey("pkcs8",b2u(v.sk),EC,false,["sign"]);
const p=JSON.stringify({i:id,e:Date.now()+h*36e5,n:u2b(crypto.getRandomValues(new Uint8Array(6))),k:v.k});
return"ACC1."+u2b(E.encode(p))+"."+u2b(await S.sign(SG,sk,E.encode(p)))}
async function chkCode(c,id){const[x,pb,sg]=c.trim().split(".");if(x!=="ACC1"||!sg)throw"Código inválido.";
const vk=await S.importKey("spki",b2u(SIGPUB),EC,false,["verify"]);
if(!await S.verify(SG,vk,b2u(sg),b2u(pb)))throw"Código inválido.";
const p=JSON.parse(D.decode(b2u(pb)));if(p.e<Date.now())throw"Código expirado. Peça outro à Corregedoria.";
if(p.i.toLowerCase()!==id.trim().toLowerCase())throw"Este código pertence a outro ID.";return p}
async function openBank(k){const[iv,ct]=BANK.split(".").map(b2u);return JSON.parse(D.decode(await S.decrypt({name:"AES-GCM",iv},await S.importKey("raw",b2u(k),"AES-GCM",false,["decrypt"]),ct)))}
//CRYPTO-END

const $=s=>document.querySelector(s),app=$("#app"),esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function build(b){const o=sh(b.o).slice(0,5).map(([q,op,a])=>{const x=sh(op.map((_,k)=>k));return{q,o:x.map(k=>op[k]),a:x.indexOf(a)}}),d=sh(b.d).slice(0,5).map(q=>({q}));return o.flatMap((x,k)=>[x,d[k]])}
let me={},Qs=[],ans=[],i=0,left=T,tm=null,pick=null,live=false,EV=[],qs=0,cur=null;
const sec=()=>Math.round((Date.now()-qs)/1000),add=(k,x)=>{if(live)EV.push({q:i,k,s:sec(),x})};
function out(){if(live&&!cur){cur={q:i,k:"foco",s:sec(),d:0,t:Date.now()};EV.push(cur)}}

document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{pick=+b.dataset.k;document.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===b))});
$("#nx").onclick=()=>next(false);paint();clearInterval(tm);tm=setInterval(()=>{left--;paint();if(left<=0)next(true)},1000)}
function paint(){const m=$("#tm");if(!m)return;m.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;m.classList.toggle("low",left<=20);$("#br").style.width=(left/T*100)+"%"}
function next(to){clearInterval(tm);const q=Qs[i];ans.push({t:T-Math.max(left,0),to,r:q.o?pick:($("#r")?.value||"").trim()});if(++i<Qs.length)ask();else finish()}
async function finish(){live=false;back();app.innerHTML=`<div class="card"><h2>GERANDO RELATÓRIO...</h2></div>`;
const rep={n:me.n,d:me.d,dt:new Date().toLocaleString("pt-BR"),c:{i:me.c.i,e:me.c.e,n:me.c.n},a:Qs.map((q,k)=>({...q,...ans[k]})),ev:EV.map(({t,...e})=>e)};
try{const code=await seal(JSON.stringify(rep));
app.innerHTML=`<div class="card"><h2>PROVA ENCERRADA</h2><p>Copie o código abaixo e envie no canal indicado pela Corregedoria. Você não tem acesso ao conteúdo dele.</p><pre id="cd">${code}</pre><button id="cp">COPIAR CÓDIGO</button> <span id="ms"></span></div>`;
$("#cp").onclick=()=>cpy("#cd","#ms")}catch(e){app.innerHTML=`<div class="card err">Erro ao gerar o relatório: ${esc(e.message)}</div>`}}
function codigo(){app.innerHTML=`<div class="card"><a href="#" onclick="location.hash='';return false">← Voltar</a><h2>GERAR CÓDIGO DE ACESSO</h2><p>Acesso restrito aos corregedores. O código vale só para o ID informado e expira no prazo escolhido.</p>
<label>ID / Passaporte do candidato</label><input id="gi"><label>Validade (horas)</label><input id="gh" type="number" value="24" min="1" max="168"><label>Senha</label><input id="pw" type="password" autocomplete="off"><button id="mk">GERAR CÓDIGO</button><div id="out"></div></div>`;
$("#mk").onclick=async()=>{const o=$("#out"),id=$("#gi").value.trim(),h=Math.min(168,Math.max(1,+$("#gh").value||24));if(!id){o.innerHTML='<p class="err">Informe o ID.</p>';return}
try{const c=await mkCode($("#pw").value,id,h);o.innerHTML=`<p>Envie ao candidato <b>${esc(id)}</b> (válido por ${h}h):</p><pre id="cd2">${c}</pre><button id="cp">COPIAR</button> <span id="ms"></span>`;$("#cp").onclick=()=>cpy("#cd2","#ms")}catch(e){o.innerHTML='<p class="err">Senha incorreta.</p>'}}}
function seen(d){let m={};try{m=JSON.parse(localStorage.getItem("seen")||"{}")}catch(e){}const p=m[d.c.n];m[d.c.n]=p||d.dt;try{localStorage.setItem("seen",JSON.stringify(m))}catch(e){}return p&&p!==d.dt?p:null}
function render(txt){let d;try{d=JSON.parse(txt)}catch(e){return`<pre class="rep">${esc(txt)}</pre>`}
if(!d.a||!d.a[0]||!d.a[0].q||!d.c)return'<p class="err">Código de versão antiga.</p>';
const m=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0"),L="ABCD",ev=d.ev||[];
const W=e=>e.k==="paste"?(e.x>=20?3:1):e.k==="foco"?(e.d>=10?3:e.d>=3?2:1):e.k==="menu"?1:2;
const LB=e=>({paste:`Colou texto (${e.x} caracteres)`,copy:"Copiou conteúdo",cut:"Recortou conteúdo",foco:`Saiu da tela/aba por ${e.d}s`,menu:"Abriu o menu do botão direito",atalho:`Atalho suspeito: ${esc(e.x)}`}[e.k]);
const sc=ev.reduce((a,e)=>a+W(e),0),lv=sc>=8?["ALTO","a3"]:sc>=4?["MÉDIO","a2"]:sc>=1?["BAIXO","a1"]:["NENHUM","a0"],n=k=>ev.filter(e=>e.k===k).length,fo=ev.filter(e=>e.k==="foco");
let ok=0,to=0;
const cards=d.a.map((a,k)=>{if(a.to)to++;const es=ev.filter(e=>e.q===k);let body;
if(a.o){const c=a.r===a.a;if(c)ok++;body=a.o.map((t,j)=>`<div class="op${j===a.a?' gab':''}${j===a.r?(c?' ok':' no'):''}">${L[j]}) ${esc(t)}${j===a.r?' <em>← resposta do candidato</em>':''}${j===a.a?' <em>✔ gabarito</em>':''}</div>`).join("")+(a.r==null?'<div class="op no">Sem resposta</div>':'')}
else body=a.r?`<div class="ans">${esc(a.r)}</div>`:'<div class="ans blank">Em branco</div>';
return`<div class="qc ${a.o?'ob':'di'}"><div class="qh"><b>QUESTÃO ${k+1}</b><span class="tg">${a.o?'OBJETIVA':'DISSERTATIVA'}</span><span class="tg">${a.t}s</span>${a.to?'<span class="tg bad">TEMPO ESGOTADO</span>':''}${es.length?`<span class="tg bad">${es.length} ALERTA(S)</span>`:''}</div><p class="qq">${esc(a.q)}</p>${body}${es.length?`<div class="al">${es.map(e=>`<div>⚠ ${m(e.s)} · ${LB(e)}</div>`).join("")}</div>`:''}</div>`}).join("");
const pv=seen(d),fl=[];if(pv)fl.push(`Este código de acesso já foi usado em outra prova (${esc(pv)}).`);if(d.d.toLowerCase()!==d.c.i.toLowerCase())fl.push("ID digitado diferente do ID do código.");
return`<div class="sum"><div><small>CANDIDATO</small><b>${esc(d.n)}</b></div><div><small>ID</small><b>${esc(d.d)}</b></div><div><small>DATA</small><b>${esc(d.dt)}</b></div><div><small>OBJETIVAS</small><b class="big">${ok}/5</b></div><div><small>TEMPO ESGOTADO</small><b>${to}</b></div></div>
<div class="alb ${lv[1]}"><b>🚨 ALERTAS DE POSSÍVEL COLA: ${lv[0]}</b><div>Saídas de tela: ${fo.length} (${fo.reduce((a,e)=>a+e.d,0)}s fora) · Colagens: ${n("paste")} · Cópias/recortes: ${n("copy")+n("cut")} · Atalhos/menu: ${n("atalho")+n("menu")}</div><small>São indícios, não prova. Avalie junto com as respostas.</small></div>
${fl.map(f=>`<div class="alb a3"><b>⚠ ${f}</b></div>`).join("")}${cards}`}
function panel(){app.innerHTML=`<div class="card"><a href="#" onclick="location.hash='';return false">← Voltar à prova</a><h2>PAINEL DA CORREGEDORIA</h2><p>Acesso restrito aos corregedores.</p><label>Código da prova</label><textarea id="cd"></textarea><label>Senha</label><input id="pw" type="password" autocomplete="off"><button id="op">ABRIR</button><div id="out"></div></div>`;
$("#op").onclick=async()=>{const o=$("#out");try{o.innerHTML=render(await openReport($("#cd").value,$("#pw").value))}catch(e){o.innerHTML='<p class="err">Senha incorreta ou código inválido.</p>'}}}
route();
</script></body></html>
